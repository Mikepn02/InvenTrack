spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/rcastock
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: ${AIVEN_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: smtp.gmail.com
    port: 465
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: "*"
        starttls:
          enable: true
      protocol: smtp

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.type.mapping: notificationMessage:com.rca.stock.dto.notification.NotificationMessage
    consumer:
      group-id: stock-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: '*'
        spring.json.type.mapping: notificationMessage:com.rca.stock.dto.notification.NotificationMessage

application:
  security:
    jwt:
      secret-key: ${JWT_SECRET}
      expiration: 86400000 # a day
      refresh-token:
        expiration: 604800000 # 7 days
    mailing:
      frontend:
        activation-url: http://localhost:3000/activation-code
        reset-url: http://localhost:3000/reset-code
    cors:
      origins: http://localhost:4200,http://localhost:8080,http://localhost:3000,http://localhost:5173

server:
  servlet:
    context-path: /api/v1

springdoc:
  default-consumes-media-type: application/json
